[tool.poetry]
name = "minecraft-data"
version = "3.20.1"
description = "Provide easy access to minecraft data in python"
authors = [
    {name = "Vito Gamberini", email = "vito@gamberini.email"},
]
maintainers = [
    {name = "Reuben Brasher", email = "rkbrasher@gmail.com"},
]
license = "MIT"
readme = "README.rst"
repository = "https://github.com/Ugo75b/python-minecraft-data"
packages = [{include = "minecraft_data"}]
include = ["minecraft_data/data/data/*"]

[tool.poetry.dependencies]
python = "^3.11"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.1"
black = "^26.3.1"
flake8 = "^7.3.0"
coverage = "^7.12.0"
pytest-cov = "^7.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
